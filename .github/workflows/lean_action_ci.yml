name: Lean Action CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - lean-toolchain
      - lakefile.toml
      - lakefile.lean
      - lake-manifest.json
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.lean"
      - lean-toolchain
      - lakefile.toml
      - lakefile.lean
      - lake-manifest.json
      - ".github/workflows/**"
  workflow_dispatch:

# One run per PR (or branch); cancel superseded pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    # King-and-pawn `checkFile` native_decides add ~9 minutes on a cold CI
    # runner, on top of the existing king-and-queen / king-and-rook checks.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Key on toolchain + lockfile, not github.sha. lean-action's default
      # cache embeds the commit hash, so every run saved a fresh ~2.4 GB
      # entry and exhausted the 10 GB repo quota within a few PRs.
      - uses: actions/cache@v5
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # `set_option linter.*` / `set_option warningAsError` would let a file
      # silence the --wfail gate below. Ban those in source; fix warnings.
      - name: Forbid warning-setting changes in source
        run: |
          set -euo pipefail
          if grep -nE --include='*.lean' -R \
               '^[[:space:]]*set_option[[:space:]]+(linter|warningAsError)\>' \
               Chess Chess.lean; then
            echo "::error::Source files must not change warning settings; fix the warnings instead."
            exit 1
          fi

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          use-mathlib-cache: true
          build-args: "--wfail"
